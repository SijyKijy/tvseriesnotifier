name: tv-series-notifier
on:
    schedule:
        - cron: '00 06 * * *' # ~9:00 MSK (+03)
    workflow_dispatch:
        inputs:
            date:
                description: 'MSK date (YYYY-MM-DD) to resend notifications for, empty = today'
                required: false
                type: string
            dry_run:
                description: 'Log payloads without posting to Discord'
                required: false
                type: boolean
                default: false
jobs:
    notifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'

            - name: Notify
              run: node index.js
              env:
                  WEBHOOK_PATHS: ${{ secrets.WEBHOOK_PATHS }} # ["id/token", ...]
                  TVMAZE_PROFILE: users/336089/sijykijy
                  TVMAZE_COUNTRIES: US,GB,JP
                  TEST_DATE: ${{ inputs.date }}
                  DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
